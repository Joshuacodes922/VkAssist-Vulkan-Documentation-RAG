services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: vkassist-postgres
    environment:
      POSTGRES_DB: vkassist
      POSTGRES_USER: vkassist
      POSTGRES_PASSWORD: vkassist
    ports:
      - "5434:5432"
    volumes:
      - vkassist_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: vkassist-api
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg://vkassist:vkassist@postgres:5432/vkassist
    ports:
      - "8000:8000"

volumes:
  vkassist_data:
